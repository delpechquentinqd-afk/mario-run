<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#E52521"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mario Run"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-180.png"><title>Mario Run EPS</title><style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f5f9;color:#17213a}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;background:linear-gradient(180deg,#fff,#f2f5f9)}#boot .box{max-width:560px}#boot img{width:min(290px,70vw);height:auto;display:block;margin:0 auto 22px;filter:drop-shadow(0 12px 28px rgba(23,33,58,.12))}#boot .line{width:92px;height:6px;border-radius:999px;margin:0 auto 18px;background:linear-gradient(90deg,#e52521 0 25%,#f7cc18 25% 50%,#168fd2 50% 75%,#39a852 75%)}#boot .spin{width:32px;height:32px;border:4px solid #e3e8ef;border-top-color:#e52521;border-radius:50%;margin:18px auto;animation:r .85s linear infinite}#boot p{font-size:16px;line-height:1.4;color:#5e687d}#boot .err{color:#9b1c1c;font-weight:800}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body><div id="boot"><div class="box"><img src="./icon-512.png" alt="Mario Run EPS"><div class="line"></div><div class="spin" aria-hidden="true"></div><p id="msg">Chargement de Mario Run…</p></div></div><script>
(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){try{window.MARIO_RUN_SW_REG=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});}catch(e){console.warn('SW',e);}}if(typeof DecompressionStream!=='function')throw new Error('Cette version nécessite iPadOS/Safari 16.4 ou plus récent.');const names=['./app-part-1.gz?v=13149','./app-part-2.gz?v=13149','./app-part-3.gz?v=13149'];const chunks=await Promise.all(names.map(async name=>{const res=await fetch(name,{cache:'no-store'});if(!res.ok)throw new Error('Fichier manquant : '+name.split('?')[0]);const stream=res.body.pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer());}));const total=chunks.reduce((n,c)=>n+c.length,0),merged=new Uint8Array(total);let off=0;for(const c of chunks){merged.set(c,off);off+=c.length;}const html=new TextDecoder('utf-8').decode(merged);document.open();document.write(html);document.close();}catch(err){console.error(err);msg.className='err';msg.textContent='Impossible de charger Mario Run : '+(err?.message||err);}})();
</script></body></html>
